version: 1
name: github
rules:
  - name: create-issue
    match:
      hosts:
        - api.github.com
      methods:
        - POST
      path: /repos/*/*/issues
    tier: needs-approval
    idempotency_key: '"github-issue:" + request.body_sha256'
    undo:
      method: PATCH
      url: ${response.url}
      headers:
        Content-Type: application/json
      body: '{"state":"closed"}'
      effect: close the created GitHub issue
      still_exists: the issue and its history remain on GitHub in a closed state; GitHub REST cannot delete an issue
